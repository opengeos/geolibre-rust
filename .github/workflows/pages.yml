name: Deploy demo to Pages

# Production deploy of the browser demo, served from the org custom domain
# (opengeos.github.io inherits opengeos.org) at https://opengeos.org/geolibre-rust/.
#
# This uses the native GitHub Pages deployment: the assembled site is uploaded as
# a workflow artifact and served straight from it. Nothing is committed to the
# repo. That matters here because each deploy carries ~25 MB of WASM
# (geolibre-cli.wasm + geolibre_wasm_bg.wasm) which does not delta-compress, so
# the previous branch-based deploy grew `gh-pages` by ~25 MB *per push to main* —
# 467 MB of permanent history in its first four days. Artifacts expire instead
# (retention-days defaults to 1 for Pages artifacts).
#
# One-time setup (repo admin): Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions". The old "Deploy from a branch" / gh-pages source
# must be switched over or this workflow's deploy step will fail.
#
# No .nojekyll needed: the native deployment serves the artifact verbatim and
# never runs Jekyll.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. The grants that can actually publish a site
# (pages: write and the OIDC token) are scoped to the deploy job below, so the
# build job — which runs build.sh, a piped wasm-pack installer and a downloaded
# wasi-sdk — never holds a token that can deploy.
permissions:
  contents: read

# Do not cancel a deploy that is already publishing — let it finish and queue the
# next one behind it, so main never lands on a half-swapped site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      pages: read # configure-pages reads the site's URL metadata
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install wasi-sdk (C toolchain so zstd-sys builds for wasm32-wasip1)
        run: |
          ver=33.0
          curl -sL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-${ver}-x86_64-linux.tar.gz" | sudo tar xz -C /opt
          sdk=/opt/wasi-sdk-${ver}-x86_64-linux
          echo "CC_wasm32_wasip1=$sdk/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_wasip1=$sdk/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CFLAGS_wasm32_wasip1=--sysroot=$sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: Build both WASM artifacts and assemble the site
        run: |
          ./build.sh
          mkdir -p site
          cp demo/index.html           site/index.html
          cp demo/benchmark.html       site/benchmark.html
          cp npm/tools.mjs             site/tools.mjs
          cp npm/geolibre-cli.wasm     site/geolibre-cli.wasm
          cp npm/geolibre_wasm.js      site/geolibre_wasm.js
          cp npm/geolibre_wasm_bg.wasm site/geolibre_wasm_bg.wasm
          cp examples/sample.tif       site/sample.tif
          # cache-bust the glue + wasm together so returning visitors never mix
          # an old cached loader with a freshly built module
          sed -i "s/__BUILD__/${GITHUB_SHA}/g" site/index.html site/benchmark.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # create the Pages deployment
      id-token: write # mint the OIDC token deploy-pages exchanges with Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
