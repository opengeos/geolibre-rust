name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create releases / upload assets
  id-token: write # OIDC token for npm Trusted Publishing (+ provenance)

jobs:
  # Every artifact this workflow publishes is built from the same locked graph,
  # so nothing is released unless its dependency licenses pass.
  licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-deny
      - name: Dependency licenses
        run: cargo deny --locked check licenses

  release:
    needs: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install wasi-sdk (C toolchain so zstd-sys builds for wasm32-wasip1)
        run: |
          ver=33.0
          curl -sL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-${ver}-x86_64-linux.tar.gz" | sudo tar xz -C /opt
          sdk=/opt/wasi-sdk-${ver}-x86_64-linux
          echo "CC_wasm32_wasip1=$sdk/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_wasip1=$sdk/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CFLAGS_wasm32_wasip1=--sysroot=$sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; the runner's bundled
      # npm is older, so upgrade the CLI before publishing. Pin to a known-good
      # version: `npm@latest` briefly shipped a build missing the bundled
      # `sigstore` module, which breaks `npm publish --provenance`.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11.5.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build both WASM artifacts (library + WASI runner)
        run: ./build.sh

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-about

      - name: Generate third-party notices
        run: python3 scripts/third_party_notices.py npm/THIRD-PARTY-NOTICES.txt

      - name: Sync package version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: npm
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # No NODE_AUTH_TOKEN needed: npm authenticates via the OIDC id-token from
      # the configured trusted publisher and attaches build provenance.
      - name: Publish to npm (Trusted Publishing)
        working-directory: npm
        run: npm publish --provenance --access public

      # Keep the Python package version and the runtime version it downloads in
      # lockstep with the tag, so a tag is the single source of truth.
      - name: Sync Python package version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$ver\"/" python/pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$ver\"/" python/src/geolibre_wasm/__init__.py
          sed -i "s|^RUNTIME_VERSION = .*|RUNTIME_VERSION = \"v$ver\"|" python/src/geolibre_wasm/_core.py

      - name: Build Python wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build --outdir python-dist python

      # No token needed: PyPI authenticates via the OIDC id-token from the
      # configured trusted publisher. Requires a PyPI trusted publisher for
      # project "geolibre-wasm" (owner opengeos, repo geolibre-rust, workflow
      # release.yml); for the first release, configure it as a pending publisher.
      - name: Publish to PyPI (Trusted Publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist

      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          # browser library (wasm-bindgen)
          cp npm/geolibre_wasm_bg.wasm dist/geolibre_wasm_bg-${GITHUB_REF_NAME}.wasm
          cp npm/geolibre_wasm.js      dist/geolibre_wasm-${GITHUB_REF_NAME}.js
          cp npm/geolibre_wasm.d.ts    dist/geolibre_wasm-${GITHUB_REF_NAME}.d.ts
          # WASI tool runner
          cp npm/geolibre-cli.wasm     dist/geolibre-cli-${GITHUB_REF_NAME}.wasm
          cp npm/tools.mjs             dist/tools-${GITHUB_REF_NAME}.mjs
          cp npm/tools.d.ts            dist/tools-${GITHUB_REF_NAME}.d.ts
          # Python wheel + sdist
          cp python-dist/*.whl python-dist/*.tar.gz dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Native `geolibre` runners for desktop hosts (RustGIS runs one as a
  # subprocess for its GeoLibre tools): one archive per platform, attached to
  # the same release. Built with the `dist` profile (speed-optimised). They
  # don't wait for the wasm/npm job: a publishing problem there shouldn't hold
  # them back.
  native:
    needs: licenses
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, runs: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, runs: true }
          - { os: macos-latest, target: aarch64-apple-darwin, runs: true }
          # Cross-built on an arm64 runner, which can't run it.
          - { os: macos-latest, target: x86_64-apple-darwin, runs: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, runs: true }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.target }}

      - name: Build the runner
        run: cargo build --profile dist -p geolibre-cli --target ${{ matrix.target }}

      - name: Smoke test the release build
        if: matrix.runs
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/dist/geolibre"
          "$exe" version
          "$exe" slope --input=examples/sample.tif --output="$RUNNER_TEMP/slope.tif"
          test -s "$RUNNER_TEMP/slope.tif"

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="geolibre-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/dist/geolibre" LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "geolibre-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/dist/geolibre.exe", LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # One upload for all platforms, and only when every one of them built: a
  # release never ends up with some platforms silently missing. It waits for
  # the `release` job so the two never create the release concurrently, but
  # runs whatever that job's outcome: a wasm/npm failure doesn't hold back the
  # native runners.
  native-publish:
    needs: [native, release]
    if: ${{ !cancelled() && needs.native.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Check every platform is present
        run: |
          ls -l dist
          test "$(ls dist/*.tar.gz dist/*.zip | wc -l)" -eq 5

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          # When the release job failed before creating the release, this one
          # creates it; keep its notes the same either way.
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
