name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install wasi-sdk (C toolchain so zstd-sys builds for wasm32-wasip1)
        run: |
          ver=33.0
          curl -sL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-${ver}-x86_64-linux.tar.gz" | sudo tar xz -C /opt
          sdk=/opt/wasi-sdk-${ver}-x86_64-linux
          echo "CC_wasm32_wasip1=$sdk/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_wasip1=$sdk/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CFLAGS_wasm32_wasip1=--sysroot=$sdk/share/wasi-sysroot" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Host tests
        run: cargo test -p geolibre-cli -p geolibre-tools -p geolibre-pmtiles -p geolibre-wasm

      - name: Build both WASM artifacts (library + WASI runner)
        run: ./build.sh

      - name: Install npm deps and smoke test (library + tools)
        working-directory: npm
        run: |
          npm install --no-save @bjorn3/browser_wasi_shim@^0.4.2
          node ../examples/node-demo.mjs

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test the Python wrapper against the freshly built runtime
        env:
          # Use the runtime just built by build.sh instead of downloading it.
          GEOLIBRE_WASM: ${{ github.workspace }}/npm/geolibre-cli.wasm
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./python pytest
          pytest python/tests -q

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-deny,cargo-about
      - name: Dependency licenses
        run: cargo deny --locked check licenses
      - name: Third-party notices
        run: python3 scripts/third_party_notices.py "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt"

  # The native runner (released per platform for desktop hosts) must build and
  # run on macOS and Windows too, not only Linux.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the runner
        run: cargo build -p geolibre-cli

      # Run a real tool, not just the registry listing.
      - name: Smoke test
        shell: bash
        run: |
          ./target/debug/geolibre version
          ./target/debug/geolibre manifest slope > /dev/null
          ./target/debug/geolibre slope --input=examples/sample.tif --output="$RUNNER_TEMP/slope.tif"
          test -s "$RUNNER_TEMP/slope.tif"
