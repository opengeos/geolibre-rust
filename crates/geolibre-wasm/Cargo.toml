[package]
name = "geolibre-wasm"
version = "1.4.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust geospatial toolkit (raster, vector, LiDAR, projections) compiled to WebAssembly for GeoLibre"

[lib]
# wasm-bindgen browser library. Built with `wasm-pack build --target web`, which
# emits geolibre_wasm.js + geolibre_wasm_bg.wasm + geolibre_wasm.d.ts.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Built on opengeos/whitebox-wasm's enhanced WASM crates (byte-buffer reads,
# COG streaming, in-memory writers). See crates/geolibre-cli/Cargo.toml.
wbgeotiff = { git = "https://github.com/opengeos/whitebox-wasm" }
wbprojection = { git = "https://github.com/opengeos/whitebox-wasm", default-features = false }
wbvector = { git = "https://github.com/opengeos/whitebox-wasm", features = ["geoparquet", "kmz", "osmpbf"] }
wblidar = { git = "https://github.com/opengeos/whitebox-wasm" }
wbtopology = { git = "https://github.com/opengeos/whitebox-wasm" }
wbspatialstats = { git = "https://github.com/opengeos/whitebox-wasm" }
# Shared PMTiles v3 core (format, writer, bbox extract). Lightweight by
# design (flate2 only) so it doesn't bloat the browser bundle.
geolibre-pmtiles = { path = "../geolibre-pmtiles" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# GeoArrow output + the in-memory GeoParquet reader. All four arrow crates and
# parquet already arrive transitively through wbvector's `geoparquet` feature;
# naming them here just makes them callable. Versions must stay in lockstep
# with that transitive copy or the arrow types will not unify.
#
# Reaching this code is what costs bundle size, not linking it: making both
# readers callable takes the browser artifact from ~4.5 MB to ~6.4 MB (1.2 ->
# 1.9 MB gzipped). Both are on by default and can be switched off individually
# by a size-sensitive consumer — see [features] below.
arrow-array = { version = "58.3", optional = true }
arrow-buffer = { version = "58.3", optional = true }
arrow-ipc = { version = "58.3", optional = true }
arrow-schema = { version = "58.3", optional = true }
parquet = { version = "58.3", optional = true }
bytes = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["arrow", "geoparquet"]
# vector_to_arrow_ipc: GeoArrow-encoded Arrow IPC output.
arrow = ["dep:arrow-array", "dep:arrow-buffer", "dep:arrow-ipc", "dep:arrow-schema"]
# Reading .parquet from a byte buffer in the browser.
geoparquet = ["dep:parquet", "dep:bytes", "dep:serde_json"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

# The wasm-opt bundled with some wasm-pack versions predates bulk-memory being
# on by default in LLVM output. Enable the features the toolchain now emits.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-nontrapping-float-to-int', '--enable-sign-ext', '--enable-mutable-globals']

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
