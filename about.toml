# cargo-about: the attributions shipped as THIRD-PARTY-NOTICES.txt in the npm
# package, the native runner archives, the release assets and the demo site.
# Covers the crates compiled into the two WASM artifacts and the native runners;
# scripts/third_party_notices.py adds the rest. Keep `targets` in step with the
# native matrix in release.yml and `accepted` with the allow list in deny.toml.
targets = [
    "wasm32-wasip1",
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
]
